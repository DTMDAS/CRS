<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Pay - Add Gift Card</title>
    <style>
        :root {
            --amazon-orange: #ff9900;
            --amazon-dark: #131921;
            --amazon-blue: #007185;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #eaeded;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--amazon-dark);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--amazon-orange);
        }
        .nav-links button {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 10px;
        }
        .nav-links button.active {
            background: var(--amazon-orange);
            color: black;
            border-color: var(--amazon-orange);
            font-weight: bold;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #0f1111;
            font-size: 20px;
            border-bottom: 1px solid #d5dbdb;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #a6b1b1;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus {
            border-color: var(--amazon-orange);
            outline: none;
            box-shadow: 0 0 3px rgba(255,153,0,0.5);
        }
        .btn {
            background: var(--amazon-orange);
            border: none;
            color: black;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn:hover {
            background: #fa8900;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        .code-list {
            margin-top: 15px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 5px;
            background: #f9f9f9;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>amazon pay</h1>
        <div class="nav-links">
            <button id="userNavBtn" class="active" onclick="switchTab('user')">User Panel</button>
            <button id="adminNavBtn" onclick="switchTab('admin')">Admin Panel</button>
        </div>
    </header>

    <!-- User Section -->
    <div id="userSection" class="container section active">
        <h2>Add Gift Card to Your Balance</h2>
        <div class="form-group">
            <label>Enter claim code</label>
            <input type="text" id="claimCodeInput" placeholder="e.g. APAY-XXXX-YYYY">
        </div>
        <button class="btn" onclick="claimCode()">Add to your balance</button>
        <div id="userMessage" class="message"></div>
    </div>

    <!-- Admin Section -->
    <div id="adminSection" class="container section">
        <h2>Admin Panel - Generate Codes</h2>
        <div class="form-group">
            <label>Gift Card Code</label>
            <input type="text" id="newCodeInput" placeholder="Enter custom code or generate">
        </div>
        <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="newAmountInput" placeholder="e.g. 500">
        </div>
        <button class="btn" onclick="addCodeByAdmin()">Create & Add Code</button>
        <div id="adminMessage" class="message"></div>
        
        <h3 style="font-size: 15px; margin-top: 20px;">Existing Active Codes:</h3>
        <div id="existingCodesList" class="code-list"></div>
    </div>

    <script>
        // Initialize default codes in localStorage if not present
        if (!localStorage.getItem('giftCodes')) {
            const initialCodes = {
                "APAY-100-TEST": 100,
                "APAY-500-FREE": 500
            };
            localStorage.setItem('giftCodes', JSON.stringify(initialCodes));
        }

        function switchTab(tab) {
            if (tab === 'user') {
                document.getElementById('userSection').classList.add('active');
                document.getElementById('adminSection').classList.remove('active');
                document.getElementById('userNavBtn').classList.add('active');
                document.getElementById('adminNavBtn').classList.remove('active');
            } else {
                document.getElementById('userSection').classList.remove('active');
                document.getElementById('adminSection').classList.add('active');
                document.getElementById('userNavBtn').classList.remove('active');
                document.getElementById('adminNavBtn').classList.add('active');
                loadAdminCodes();
            }
        }

        function claimCode() {
            const codeInput = document.getElementById('claimCodeInput').value.trim();
            const msgBox = document.getElementById('userMessage');
            
            if (!codeInput) {
                showMsg(msgBox, "Please enter a valid gift card code.", "error");
                return;
            }

            let codes = JSON.parse(localStorage.getItem('giftCodes')) || {};

            if (codes.hasOwnProperty(codeInput)) {
                let amount = codes[codeInput];
                // Remove code after successful claim (one-time use)
                delete codes[codeInput];
                localStorage.setItem('giftCodes', JSON.stringify(codes));

                showMsg(msgBox, `Success! ₹${amount} has been added to your Amazon Pay balance.`, "success");
                document.getElementById('claimCodeInput').value = '';
            } else {
                showMsg(msgBox, "The gift card code you entered is invalid or has already been used.", "error");
            }
        }

        function addCodeByAdmin() {
            const code = document.getElementById('newCodeInput').value.trim();
            const amount = document.getElementById('newAmountInput').value.trim();
            const msgBox = document.getElementById('adminMessage');

            if (!code || !amount) {
                showMsg(msgBox, "Please fill in both fields.", "error");
                return;
            }

            let codes = JSON.parse(localStorage.getItem('giftCodes')) || {};
            codes[code] = parseFloat(amount);
            localStorage.setItem('giftCodes', JSON.stringify(codes));

            showMsg(msgBox, `Code '${code}' of ₹${amount} created successfully!`, "success");
            document.getElementById('newCodeInput').value = '';
            document.getElementById('newAmountInput').value = '';
            loadAdminCodes();
        }

        function loadAdminCodes() {
            let codes = JSON.parse(localStorage.getItem('giftCodes')) || {};
            let listDiv = document.getElementById('existingCodesList');
            listDiv.innerHTML = '';

            let keys = Object.keys(codes);
            if (keys.length === 0) {
                listDiv.innerHTML = '<i>No active codes available.</i>';
                return;
            }

            keys.forEach(key => {
                let item = document.createElement('div');
                item.style.padding = "4px 0";
                item.style.borderBottom = "1px solid #eee";
                item.innerText = `${key} — ₹${codes[key]}`;
                listDiv.appendChild(item);
            });
        }

        function showMsg(element, text, type) {
            element.innerText = text;
            element.className = `message ${type}`;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
